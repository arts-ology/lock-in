
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>study space</title>
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="lilac">

  <div id="main-screen">

    <div id="sparkle-layer" aria-hidden="true"></div>

    <div id="quote-area">
      <p id="quote-text">loading a quote...</p>
    </div>

    <div id="timer-area">
      <div id="clock" role="button" aria-label="tap to adjust timer, long-press to reset">
        <span id="clock-text">25:00</span>
        <svg id="longpress-ring" viewBox="0 0 96 96" aria-hidden="true">
          <circle cx="48" cy="48" r="44"></circle>
        </svg>
      </div>
      <p id="mode-label">focus</p>

      <div id="stepper" class="hidden">
        <button class="step-btn" data-amount="-5">-5</button>
        <button class="step-btn" data-amount="-1">-1</button>
        <span id="stepper-label">focus min</span>
        <button class="step-btn" data-amount="1">+1</button>
        <button class="step-btn" data-amount="5">+5</button>
      </div> 

<div id="companion">
   <img id="companion-img" src="assets/companions/idle.gif">
</div>
      <!-- Tap = start/pause -->
      <button id="play-btn">
        <span id="play-label">start</span>
      </button>
    </div>

    <div id="theme-row">
      <button class="swatch" data-theme="lilac" aria-label="Lilac Dream theme"></button>
      <button class="swatch" data-theme="sky" aria-label="Sky Soda theme"></button>
      <button class="swatch" data-theme="bubblegum" aria-label="Bubblegum theme"></button>
      <button class="swatch" data-theme="vanilla" aria-label="Vanilla Sky theme"></button>
    </div>

  </div>

  <div id="screensaver" class="hidden">
    <div id="screensaver-sparkles" aria-hidden="true"></div>
    <div id="screensaver-clock">--:--</div>
    <div id="screensaver-date">-</div>
  </div>



  <script src="renderer.js"></script>
</body>
</html>
